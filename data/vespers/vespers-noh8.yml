# VESPERS ITEMS IN NOH8 (Vesperale) -- reviewed by hand against the scans, 2026-09-27.
#
# What `noh vespers-lineup` builds each Sunday's Vespers from. Proposals come from
# `noh vespers-items` (data/vespers/vespers-noh8.proposed.yml: headings and tone labels read
# from the text layer and a wide margin crop); each entry here was checked against
# the page. A system is named by its ref, <volume>/<pdf page>/<system>.
#
# The Sunday office (pp. 1-27) prints each psalm as: the antiphon's intonation, the
# psalm accompanied verse by verse, then the full antiphon. Under the 1960 rubrics
# the antiphon is sung in full before and after its psalm, so the lineup uses the
# full antiphon both times and leaves the intonation out.
#
# Tones are as printed in NOH8's margin (a fixed vocabulary: pipeline/vespers.py
# TONES). vesperale's table agrees except where noted.
volume: noh8
reviewed: 2026-09-27

sunday_office:
  piece: vesperae-dominica-ad-vesperas
  initium:                 # Deus in adjutorium, ferial tone, with Alleluia (p. 1)
    refs: [noh8/0031/000, noh8/0031/001, noh8/0031/002, noh8/0031/003]
  psalms:
  - number: 109
    title: Dixit Dominus
    tone: VII.c2
    antiphon: {incipit: Dixit Dominus Domino meo, refs: [noh8/0035/004], chant: 2767}
    psalm: [noh8/0033/000, noh8/0033/002, noh8/0033/003, noh8/0033/004, noh8/0034/000,
            noh8/0034/001, noh8/0034/002, noh8/0034/003, noh8/0034/004, noh8/0034/005,
            noh8/0035/000, noh8/0035/001, noh8/0035/002, noh8/0035/003]
  - number: 110
    title: Confitebor tibi
    tone: III.b                # the antiphon's tone (p. 5); the psalm's own margin reads "Ant. VII" (p. 6), as printed
    antiphon: {incipit: Magna opera Domini, refs: [noh8/0039/001, noh8/0039/002], chant: 2908}
    psalm: [noh8/0036/000, noh8/0036/001, noh8/0036/002, noh8/0036/003, noh8/0036/004,
            noh8/0036/005, noh8/0037/000, noh8/0037/001, noh8/0037/002, noh8/0037/003,
            noh8/0037/004, noh8/0037/005, noh8/0038/000, noh8/0038/001, noh8/0038/002,
            noh8/0038/003, noh8/0038/004, noh8/0038/005, noh8/0039/000]
  - number: 111
    title: Beatus vir
    tone: IV.g
    antiphon: {incipit: Qui timet Dominum, refs: [noh8/0042/003], chant: 2741}
    psalm: [noh8/0039/004, noh8/0039/005, noh8/0040/000, noh8/0040/001, noh8/0040/002,
            noh8/0040/003, noh8/0040/004, noh8/0040/005, noh8/0041/000, noh8/0041/001,
            noh8/0041/002, noh8/0041/003, noh8/0041/004, noh8/0041/005, noh8/0042/000,
            noh8/0042/001, noh8/0042/002]
  - number: 112
    title: Laudate pueri
    tone: VII.c                # OCR read "VII. e"; the scan reads VII c (p. 12)
    antiphon: {incipit: Sit nomen Domini, refs: [noh8/0044/005], chant: 1864}
    psalm: [noh8/0042/005, noh8/0043/000, noh8/0043/001, noh8/0043/002, noh8/0043/003,
            noh8/0043/004, noh8/0043/005, noh8/0044/000, noh8/0044/001, noh8/0044/002,
            noh8/0044/003, noh8/0044/004]
  - number: 113
    title: In exitu Israel
    tone: peregrinus
    antiphon: {incipit: Deus autem noster, refs: [noh8/0051/000, noh8/0051/001], chant: 2882}
    psalm: [noh8/0045/001, noh8/0045/002, noh8/0045/003, noh8/0046/000, noh8/0046/001,
            noh8/0046/002, noh8/0046/003, noh8/0046/004, noh8/0046/005, noh8/0047/000,
            noh8/0047/001, noh8/0047/002, noh8/0047/003, noh8/0047/004, noh8/0047/005,
            noh8/0048/000, noh8/0048/001, noh8/0048/002, noh8/0048/003, noh8/0048/004,
            noh8/0048/005, noh8/0049/000, noh8/0049/001, noh8/0049/002, noh8/0049/003,
            noh8/0049/004, noh8/0049/005, noh8/0050/000, noh8/0050/001, noh8/0050/002,
            noh8/0050/003, noh8/0050/004, noh8/0050/005]
  chapter:                 # 2 Cor 1:3-4, read; the response "Deo gratias" is printed (p. 21)
    text: "Benedictus Deus et Pater Domini nostri Jesu Christi, Pater misericordiarum et Deus totius consolationis, qui consolatur nos in omni tribulatione nostra."
    refs: [noh8/0051/003]
  hymn: {title: Lucis Creator optime, tone: VIII, chant: 2014,
         refs: [noh8/0051/004, noh8/0051/005, noh8/0052/000, noh8/0052/001, noh8/0052/002,
                noh8/0052/003]}
  versicle: {text: "Dirigatur, Domine, oratio mea. R. Sicut incensum in conspectu tuo.",
             refs: [noh8/0052/004, noh8/0052/005]}
  benedicamus: {refs: [noh8/0057/004, noh8/0057/005]}   # after the commemorations (p. 27)
  # Left out under the 1962 rubrics: the suffrage (p. 26) and the Eastertide
  # commemoration of the Cross (p. 27), both abolished in 1955.

