# INDEX PARTIS V — hand-transcribed ground truth.
#
# Transcribed 2026-09-07 from the printed index (PDF page 231) rendered at 400dpi
# and read in two halves. This file is AUTHORITATIVE. Both OCR sources — the PDF's
# embedded text layer and Tesseract — are cross-checks against it, never
# replacements: the index scan is measurably degraded (`98` prints as `S8`, `106`
# as `:06`, `110` as `il0`, `114` as `j14`), and only domain reasoning resolves
# those. `Credo I` is 98 because XVIII ends at 96 and Credo II begins at 102.
#
# `page` is the PRINTED folio. PDF page = printed + offset (see derived-offsets.json).
# Where the index gives a range, `last_page` is set; otherwise the piece runs to
# the next entry's start.
#
# `division` is declared per section rather than inferred from its name: it
# decides which index on the site a piece appears under.
