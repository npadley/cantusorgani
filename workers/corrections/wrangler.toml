name = "cantusorgani-corrections"
main = "src/index.ts"
compatibility_date = "2026-09-07"
workers_dev = false

# Intake is live. This is a plain var checked at the top of fetch, so setting it
# to "false" and redeploying pauses submissions without touching any other code.
[vars]
CORRECTIONS_ENABLED = "true"
ALLOWED_ORIGIN = "https://cantusorgani.org"

# Served from its own subdomain rather than a workers.dev URL, so the endpoint
# is stable and inside the zone. Same-site but cross-ORIGIN, so the CORS and
# Origin checks in src/index.ts still apply — that is deliberate.
[[routes]]
pattern = "api.cantusorgani.org"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "cantusorgani-corrections"
database_id = "4d796209-0d9a-46bd-94c0-00a6435eb502"

# TURNSTILE_SECRET is a secret, never a var. Set it with:
#   npx wrangler secret put TURNSTILE_SECRET
