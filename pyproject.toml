[project]
name = "noh-pipeline"
version = "0.1.0"
description = "Nova Organi Harmonia digitisation pipeline"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.24",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "pillow>=10.4",
  "pytesseract>=0.3.13",
  "pyyaml>=6.0",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
noh = "pipeline.cli:main"
triage = "tools.triage.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "tools"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "source: requires the untracked 230MB pdf-source/ PDFs; local only",
  "slow: renders pages at 300dpi",
]
addopts = "--strict-markers"
