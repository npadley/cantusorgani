# Test, build and deploy cantusorgani.org.
#
# Pull requests (including the admin screen's correction batches) run every
# check and build the site, but never deploy. A push to main does the same and
# then deploys to Cloudflare Pages by direct upload.
#
# Python, site and browser checks run in parallel. Only their success gates
# deploy; LilyPond and conditional scan tests also feed the aggregate check.
# The browser job hands its tested build to deploy as an artifact.
#
# Free: GitHub Actions minutes are unlimited for public repositories, and a
# wrangler direct upload does not use Cloudflare Pages' build quota.
#
# Needs, in Settings -> Secrets and variables -> Actions:
#   secrets:   CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID,
#              R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (typeset-upload;
#              docs/ADMIN-SETUP.md section 5)
#   variables: PUBLIC_ASSET_BASE, PUBLIC_CORRECTIONS_ENDPOINT, PUBLIC_TURNSTILE_SITE_KEY, R2_BUCKET
name: site

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Cancel superseded pull requests; main runs wait for the active run.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------ typeset ---
  # Typeset music (docs/TYPESETTING.md): draw what is not on R2 yet, then
  # upload it, in two jobs. LilyPond runs Scheme from the files it reads, so
  # the job that runs it has no secrets, and LilyPond itself no network; the
  # job with the R2 secrets never runs it.
  typeset-render:
    name: Typeset render
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    outputs:
      rendered: ${{ steps.render.outputs.rendered }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pinned LilyPond, cached
        id: lilypond-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/lilypond-*
          key: lilypond-${{ runner.os }}-${{ hashFiles('data/typeset/lilypond.yml') }}
      - name: Install LilyPond
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 130s bash -e -c 'uv run noh lilypond-install'; then
              exit 0
            fi
            echo "::warning::Pinned LilyPond install failed or hung (attempt $attempt of 2)."
          done
          echo "::error::Pinned LilyPond install failed or hung after two attempts."
          exit 1
      - name: Save LilyPond
        if: always() && steps.lilypond-cache.outputs.cache-primary-key != '' && steps.lilypond-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/lilypond-*
          key: ${{ steps.lilypond-cache.outputs.cache-primary-key }}
      # Ubuntu blocks unprivileged user namespaces by default; the sandbox
      # (unshare --user --net) needs one.
      - name: Allow the LilyPond sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --net --map-current-user true   # fails here, clearly, if the sandbox cannot work
      - name: Render what is not published
        id: render
        env:
          NOH_SANDBOX: "1"
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
        run: |
          uv run noh typeset-render --missing-from "$PUBLIC_ASSET_BASE"
          echo "rendered=$(find build/typeset/out -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Hand the renders to the upload job
        if: steps.render.outputs.rendered != '0'
        uses: actions/cache/save@v6
        with:
          path: build/typeset/out
          key: typeset-out-${{ github.run_id }}-${{ github.run_attempt }}

  typeset-upload:
    name: Typeset upload
    needs: typeset-render
    # Shared with typeset-prune: never upload while pruning.
    concurrency:
      group: typeset-r2-mutations
      cancel-in-progress: false
      queue: max
    # Not for pull requests from forks, which get no secrets.
    if: >-
      needs.typeset-render.outputs.rendered != '0' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: The renders
        uses: actions/cache/restore@v6
        with:
          path: build/typeset/out
          key: typeset-out-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Check and upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: uv run noh typeset-publish

  python:
    needs: [typeset-render, typeset-upload]
    # After the renders are published (the upload is skipped when there is
    # nothing new, and for forks); never after a failed render or upload.
    if: >-
      !cancelled() && needs.typeset-render.result == 'success' &&
      (needs.typeset-upload.result == 'success' || needs.typeset-upload.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks scans the pushed commits

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------- pipeline ---
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Apt cache key
        id: apt-key
        run: |
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
      - name: Restore Tesseract packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-key.outputs.image }}-tesseract-ocr-tesseract-ocr-lat-v2
      - name: Tesseract (a few unit tests read a synthetic image)
        id: tesseract
        timeout-minutes: 5
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 130s bash -e -c 'if [ "$CACHE_HIT" = "true" ] && sudo dpkg -i "$RUNNER_TEMP"/apt-archives/*.deb; then exit 0; fi; sudo dpkg --configure -a || true; A="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"; sudo apt-get $A update && sudo apt-get $A -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" -o APT::Keep-Downloaded-Packages=true install -y tesseract-ocr tesseract-ocr-lat'; then
              exit 0
            fi
            echo "::warning::Tesseract apt install failed or hung (attempt $attempt of 2)."
          done
          echo "::error::Tesseract apt install failed or hung after two attempts."
          exit 1
      - name: Save Tesseract packages
        if: always() && steps.tesseract.outcome == 'success' && steps.apt-cache.outputs.cache-primary-key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check pipeline tools tests
      # The slow tests that read the scans are the scan-tests job, below.
      # The pinned GregoBase dump (CC0, sha256-checked; not in git): the tests
      # that divide Propers into parts, and the chant notation, read it.
      - name: GregoBase dump
        run: uv run noh gregobase-fetch
      # Python's MEI prechecks render through the production Verovio runtime.
      # Install it before pytest so those tests run here rather than being skipped.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Pipeline tests
        run: uv run pytest -q -m "not slow"
      - name: Ordinary Form coverage current
        run: uv run noh ordinary-form --check
      - name: Hand corrections applied
        run: uv run noh apply-corrections --check
      # The typeset sources pass the source check, and parts.yml is sound. Needs
      # no LilyPond; the job below runs the tests that do.
      - name: Typeset sources
        run: uv run noh typeset-check
      # Every chant a part or Vespers item names has its notation, from the
      # pinned GregoBase dump (downloaded and sha256-checked; not in git).
      - name: Chant notation current
        run: |
          uv run noh chants
          git diff --exit-code --stat data/chants.json || {
            echo "::error::data/chants.json is not current. Fix: uv run noh gregobase-fetch && uv run noh chants, then commit data/chants.json"
            exit 1
          }

  site:
    needs: [typeset-render, typeset-upload]
    # After the renders are published (the upload is skipped when there is
    # nothing new, and for forks); never after a failed render or upload.
    if: >-
      !cancelled() && needs.typeset-render.result == 'success' &&
      (needs.typeset-upload.result == 'success' || needs.typeset-upload.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: ./.github/actions/playwright
      - name: Type check
        run: pnpm exec astro check
        working-directory: web
      - name: Site tests
        run: pnpm exec vitest run
        working-directory: web
      # The Worker that takes readers' reports shares the corrections database
      # with the admin screen.
      - run: pnpm install --frozen-lockfile
        working-directory: workers/corrections
      - name: Corrections Worker tests
        run: pnpm exec tsc --noEmit && pnpm exec vitest run
        working-directory: workers/corrections

      # A missing setting would still build -- with local image paths or a
      # disabled Corrections form -- so stop here instead.
      - name: Build settings present
        run: |
          for v in PUBLIC_ASSET_BASE PUBLIC_CORRECTIONS_ENDPOINT PUBLIC_TURNSTILE_SITE_KEY; do
            [ -n "${!v}" ] || { echo "::error::Repository variable $v is not set (Settings -> Secrets and variables -> Actions -> Variables)"; exit 1; }
          done
        env:
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          PUBLIC_CORRECTIONS_ENDPOINT: ${{ vars.PUBLIC_CORRECTIONS_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

  browser:
    needs: [typeset-render, typeset-upload]
    # After the renders are published (the upload is skipped when there is
    # nothing new, and for forks); never after a failed render or upload.
    if: >-
      !cancelled() && needs.typeset-render.result == 'success' &&
      (needs.typeset-upload.result == 'success' || needs.typeset-upload.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: ./.github/actions/playwright
      # Every render the manifest names answers at its public address, so the
      # site never links to music that is not there. (Forks cannot upload.)
      - name: Typeset music published
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
        run: uv run noh typeset-check --remote "$PUBLIC_ASSET_BASE"
      # Which approved MEI conversions went stale and why: the admin home lists them
      # (web/src/lib/admin/exportPaused.ts). Always exit 0; the report is the output.
      - name: Stale MEI conversions
        run: uv run noh typeset-mei-stale --json --out build/mei/stale/stale.json > /dev/null
      # Also crawls dist/: fails on any page no link reaches.
      - name: Build
        run: pnpm build
        working-directory: web
        env:
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          PUBLIC_CORRECTIONS_ENDPOINT: ${{ vars.PUBLIC_CORRECTIONS_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # The built site in a real browser, on Cloudflare's local runtime with a
      # throwaway corrections database (web/playwright.config.ts).
      - name: Browser tests
        run: |
          pnpm exec playwright test
        working-directory: web
        env:
          CI: "true"
      # The custom-export editor against the fixture manifest and the gated test
      # pages. Built to dist-e2e/, so the deployed dist/ never contains them
      # (with-public-env.ts refuses the fixture manifest with a remote asset base).
      - name: Export editor browser tests
        run: |
          pnpm build:e2e
          pnpm test:e2e:export
        working-directory: web
        env:
          CI: "true"
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

      - name: Tested site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [python, site, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: web/dist
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          packageManager: pnpm
          command: pages deploy dist --project-name cantusorgani --branch main --commit-hash ${{ github.sha }}

  # One stable required check; upload and deploy retain their skip conditions.
  check:
    needs: [typeset-render, typeset-upload, python, site, browser, lilypond-tests, scan-tests, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          DEPLOY_EXPECTED: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          echo "$NEEDS" | jq -e --arg deploy "$DEPLOY_EXPECTED" '
            .["typeset-render"].result == "success" and
            (.["typeset-upload"].result == "success" or .["typeset-upload"].result == "skipped") and
            ([.python, .site, .browser, .["lilypond-tests"], .["scan-tests"]] | all(.result == "success")) and
            .deploy.result == (if $deploy == "true" then "success" else "skipped" end)
          '

  # The tests that run LilyPond itself (marked `lilypond`), on the pinned
  # version from data/typeset/lilypond.yml, checksum-checked. No secrets: LilyPond
  # runs Scheme from the files it reads (docs/claudekit/specs/2026-09-28-typesetting-design.md §3).
  lilypond-tests:
    name: LilyPond tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pinned LilyPond, cached
        id: lilypond-cache
        uses: actions/cache/restore@v6
        with:
          path: vendor/lilypond-*
          key: lilypond-${{ runner.os }}-${{ hashFiles('data/typeset/lilypond.yml') }}
      - name: Install LilyPond
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 130s bash -e -c 'uv run noh lilypond-install'; then
              exit 0
            fi
            echo "::warning::Pinned LilyPond install failed or hung (attempt $attempt of 2)."
          done
          echo "::error::Pinned LilyPond install failed or hung after two attempts."
          exit 1
      - name: Save LilyPond
        if: always() && steps.lilypond-cache.outputs.cache-primary-key != '' && steps.lilypond-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vendor/lilypond-*
          key: ${{ steps.lilypond-cache.outputs.cache-primary-key }}
      - name: LilyPond tests
        run: uv run pytest -q -m lilypond

  # The slow tests: the pipeline reading the real scans (pdf-source/, in git).
  scan-tests:
    name: Scan tests (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # to see what the push or pull request changed
      - name: Did the code that reads the scans change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The reading code, its tests and dependencies, and what it reads.
          scan='^(pipeline/|tests/|pdf-source/|pyproject\.toml$|uv\.lock$|data/(catalog\.base\.json|index-[^/]*\.yml|volumes\.yml|derived-offsets\.json|rubrics-1962\.yml|published/|ocr/))'
          if git diff --name-only "$from" "$GITHUB_SHA" | grep -qE "$scan"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing that reads the scans changed; the slow tests are skipped."
          fi
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.changed.outputs.run == 'true'
        with:
          enable-cache: true
      - name: Apt cache key
        id: apt-key
        if: steps.changed.outputs.run == 'true'
        run: |
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
      - name: Restore Tesseract packages
        id: apt-cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-key.outputs.image }}-tesseract-ocr-tesseract-ocr-lat-v2
      - name: Tesseract
        id: tesseract
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 5
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 130s bash -e -c 'if [ "$CACHE_HIT" = "true" ] && sudo dpkg -i "$RUNNER_TEMP"/apt-archives/*.deb; then exit 0; fi; sudo dpkg --configure -a || true; A="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"; sudo apt-get $A update && sudo apt-get $A -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" -o APT::Keep-Downloaded-Packages=true install -y tesseract-ocr tesseract-ocr-lat'; then
              exit 0
            fi
            echo "::warning::Tesseract apt install failed or hung (attempt $attempt of 2)."
          done
          echo "::error::Tesseract apt install failed or hung after two attempts."
          exit 1
      - name: Save Tesseract packages
        if: always() && steps.tesseract.outcome == 'success' && steps.apt-cache.outputs.cache-primary-key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Install
        if: steps.changed.outputs.run == 'true'
        run: uv sync --frozen && uv run noh gregobase-fetch
      - name: Slow pipeline tests
        if: steps.changed.outputs.run == 'true'
        run: uv run pytest -q -m slow
