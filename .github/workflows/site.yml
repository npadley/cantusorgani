# Test, build and deploy cantusorgani.org.
#
# Pull requests (including the admin screen's correction batches) run every
# check and build the site, but never deploy. A push to main does the same and
# then deploys to Cloudflare Pages by direct upload.
#
# Two jobs, side by side:
#   check-build-deploy  the fast tests, the build, the browser tests, the deploy
#                       (about 2 minutes to the site after a merge);
#   scan-tests          the slow tests that read the scans (pages rendered at
#                       300 dpi, about 8 minutes). They test the code that reads
#                       the books, not what the site shows, so the deploy does
#                       not wait for them, and they run only when that code, its
#                       tests or its inputs change (or by hand). A failure is a
#                       red check on the commit.
#
# Free: GitHub Actions minutes are unlimited for public repositories, and a
# wrangler direct upload does not use Cloudflare Pages' build quota.
#
# Needs, in Settings -> Secrets and variables -> Actions:
#   secrets:   CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID
#   variables: PUBLIC_ASSET_BASE, PUBLIC_CORRECTIONS_ENDPOINT, PUBLIC_TURNSTILE_SITE_KEY
name: site

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# A newer push supersedes a run still going on the same branch.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks scans the pushed commits

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------- pipeline ---
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Tesseract (a few unit tests read a synthetic image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-lat
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check pipeline tools tests
      # The slow tests that read the scans are the scan-tests job, below.
      # The pinned GregoBase dump (CC0, sha256-checked; not in git): the tests
      # that divide Propers into parts, and the chant notation, read it.
      - name: GregoBase dump
        run: uv run noh gregobase-fetch
      - name: Pipeline tests
        run: uv run pytest -q -m "not slow"
      - name: Hand corrections applied
        run: uv run noh apply-corrections --check
      # The typeset sources pass the source check, and parts.yml is sound. Needs
      # no LilyPond; the job below runs the tests that do.
      - name: Typeset sources
        run: uv run noh typeset-check
      # Every chant a part or Vespers item names has its notation, from the
      # pinned GregoBase dump (downloaded and sha256-checked; not in git).
      - name: Chant notation current
        run: |
          uv run noh chants
          git diff --exit-code --stat data/chants.json || {
            echo "::error::data/chants.json is not current. Fix: uv run noh gregobase-fetch && uv run noh chants, then commit data/chants.json"
            exit 1
          }

      # --------------------------------------------------------------- site ---
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Type check
        run: pnpm exec astro check
        working-directory: web
      - name: Site tests
        run: pnpm exec vitest run
        working-directory: web
      # The Worker that takes readers' reports shares the corrections database
      # with the admin screen.
      - run: pnpm install --frozen-lockfile
        working-directory: workers/corrections
      - name: Corrections Worker tests
        run: pnpm exec tsc --noEmit && pnpm exec vitest run
        working-directory: workers/corrections

      # A missing setting would still build -- with local image paths or a
      # disabled Corrections form -- so stop here instead.
      - name: Build settings present
        run: |
          for v in PUBLIC_ASSET_BASE PUBLIC_CORRECTIONS_ENDPOINT PUBLIC_TURNSTILE_SITE_KEY; do
            [ -n "${!v}" ] || { echo "::error::Repository variable $v is not set (Settings -> Secrets and variables -> Actions -> Variables)"; exit 1; }
          done
        env:
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          PUBLIC_CORRECTIONS_ENDPOINT: ${{ vars.PUBLIC_CORRECTIONS_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      # Also crawls dist/: fails on any page no link reaches.
      - name: Build
        run: pnpm build
        working-directory: web
        env:
          PUBLIC_ASSET_BASE: ${{ vars.PUBLIC_ASSET_BASE }}
          PUBLIC_CORRECTIONS_ENDPOINT: ${{ vars.PUBLIC_CORRECTIONS_ENDPOINT }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # The built site in a real browser, on Cloudflare's local runtime with a
      # throwaway corrections database (web/playwright.config.ts).
      - name: Browser tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
        working-directory: web
        env:
          CI: "true"
      - name: Browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

      # ------------------------------------------------------------- deploy ---
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name cantusorgani --branch main --commit-hash ${{ github.sha }}

  # The tests that run LilyPond itself (marked `lilypond`), on the pinned
  # version from data/typeset/lilypond.yml, checksum-checked. No secrets: LilyPond
  # runs Scheme from the files it reads (docs/claudekit/specs/2026-09-28-typesetting-design.md §3).
  lilypond-tests:
    name: LilyPond tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Pinned LilyPond, cached
        uses: actions/cache@v4
        with:
          path: vendor/lilypond-*
          key: lilypond-${{ runner.os }}-${{ hashFiles('data/typeset/lilypond.yml') }}
      - name: Install LilyPond
        run: uv run noh lilypond-install
      - name: LilyPond tests
        run: uv run pytest -q -m lilypond

  # The slow tests: the pipeline reading the real scans (pdf-source/, in git).
  scan-tests:
    name: Scan tests (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # to see what the push or pull request changed
      - name: Did the code that reads the scans change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The reading code, its tests and dependencies, and what it reads.
          scan='^(pipeline/|tests/|pdf-source/|pyproject\.toml$|uv\.lock$|data/(catalog\.base\.json|index-[^/]*\.yml|volumes\.yml|derived-offsets\.json|rubrics-1962\.yml|published/|ocr/))'
          if git diff --name-only "$from" "$GITHUB_SHA" | grep -qE "$scan"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing that reads the scans changed; the slow tests are skipped."
          fi
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.changed.outputs.run == 'true'
        with:
          enable-cache: true
      - name: Tesseract
        if: steps.changed.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-lat
      - name: Install
        if: steps.changed.outputs.run == 'true'
        run: uv sync --frozen && uv run noh gregobase-fetch
      - name: Slow pipeline tests
        if: steps.changed.outputs.run == 'true'
        run: uv run pytest -q -m slow
