name: typeset-preview
run-name: typeset-preview ${{ github.event.client_payload.key }}
on:
  repository_dispatch:
    types: [typeset-preview]
permissions: {}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate trusted context
        id: context
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/preview.json"
          sha=$(jq -r '.commitSha' "$RUNNER_TEMP/preview.json")
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$sha" HEAD
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.context.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run noh lilypond-install
      - name: Render without network or credentials
        env:
          NOH_SANDBOX: '1'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --net --map-current-user true
          ulimit -t 180 -f 32768 -v 2097152
          uv run noh typeset-preview-render "$RUNNER_TEMP/preview.json"
      - uses: actions/upload-artifact@v7
        with:
          name: typeset-preview
          path: build/typeset-preview/
          retention-days: 1
          if-no-files-found: error
  upload:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/download-artifact@v8
        with:
          name: typeset-preview
          path: build/typeset-preview/
      - name: Verify artifacts and upload; never execute source
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: uv run noh typeset-preview-publish
