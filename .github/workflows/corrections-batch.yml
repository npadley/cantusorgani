# Turn a batch published from the admin screen into a pull request.
#
# The admin screen (web/functions/admin) sends a repository_dispatch with the
# batch; this records it in data/corrections.yml with `noh correct-batch` (which
# checks every entry again), commits to corrections/<batch> and opens a pull
# request as the GitHub App, so the site workflow's checks run on it.
#
# Most batches then merge themselves: auto-merge is switched on, and GitHub
# merges once the required check passes; merging deploys. A batch that moves
# systems between pieces, or a large one, waits for the owner instead (the
# reasons are in the pull request; pipeline/corrections.py hold_reasons). If a
# check fails, the App's webhook closes the pull request and returns the batch
# to the admin screen; so does a failed run of this workflow.
#
# Auto-merge is done with the App's token, not GITHUB_TOKEN, so the merge's push
# to main starts the site workflow (and the deploy).
#
# Needs: variable ADMIN_APP_ID, secret ADMIN_APP_PRIVATE_KEY (the App's key);
# in Settings -> General, "Allow auto-merge"; and a rule on main requiring the
# check-build-deploy check (see docs/ADMIN-SETUP.md).
name: corrections-batch
run-name: corrections ${{ github.event.client_payload.batch }}

on:
  repository_dispatch:
    types: [corrections-batch]

concurrency:
  group: corrections-batch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ADMIN_APP_ID }}
          private-key: ${{ secrets.ADMIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen

      # The payload goes through a file, never into a shell command line.
      - name: Read the batch
        id: batch
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/batch.json"
          id=$(jq -r '.batch' "$RUNNER_TEMP/batch.json")
          if [[ ! "$id" =~ ^b-[0-9a-z-]{6,40}$ ]]; then
            echo "::error::batch id is not of the form b-<letters, digits, ->"; exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Record the corrections
        run: uv run noh correct-batch "$RUNNER_TEMP/batch.json" --summary "$RUNNER_TEMP/pr.md" --hold "$RUNNER_TEMP/hold.txt"

      # A corrected chant link brings its notation: the pinned GregoBase dump
      # (CC0, sha256-checked) gives data/chants.json every chant now named;
      # applying again gives a newly paired chant its incipit from it.
      - name: Chant notation
        run: uv run noh gregobase-fetch && uv run noh chants && uv run noh apply-corrections

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BATCH: ${{ steps.batch.outputs.id }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "corrections/$BATCH"
          git add data/corrections.yml data/catalog.json data/vespers/vespers-lineup.json data/corrections-log.json data/chants.json
          count=$(jq '.entries | length' "$RUNNER_TEMP/batch.json")
          git commit -q -m "data: corrections batch $BATCH ($count)"
          git push -q origin "corrections/$BATCH"
          gh pr create --base main --head "corrections/$BATCH" \
            --title "Corrections: batch $BATCH ($count)" --body-file "$RUNNER_TEMP/pr.md"
          # Auto-merge only when main requires the site's check: without that rule
          # GitHub would merge at once, before any check ran. Any failure here
          # leaves the pull request open for the owner, as before; it never fails
          # the run (which would return the batch while its pull request is open).
          if [ -s "$RUNNER_TEMP/hold.txt" ]; then
            echo "::notice::Waits for the owner: $(paste -sd';' "$RUNNER_TEMP/hold.txt")"
          elif ! gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
                 --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index("check-build-deploy")' \
                 | grep -qE '^[0-9]+$'; then
            echo "::warning::main does not require check-build-deploy, so this batch waits for the owner (docs/ADMIN-SETUP.md, section 4)"
          elif ! gh pr merge "corrections/$BATCH" --auto --merge; then
            echo "::warning::Could not switch on auto-merge (is Allow auto-merge ticked in Settings -> General?); this batch waits for the owner"
          fi
