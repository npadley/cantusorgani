# Keeps the dependencies current: a pull request for every security fix as soon
# as it is published (turned on in the repository's settings), and one grouped
# pull request a week for other updates. Each runs the site checks, so a
# breaking update shows up as a failed check before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /workers/corrections
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
