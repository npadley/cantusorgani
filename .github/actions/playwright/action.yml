name: Playwright browsers
description: >-
  Chromium for Playwright, cached on the version in web/pnpm-lock.yaml. The
  install is bounded and retried once, so a slow download fails fast.
runs:
  using: composite
  steps:
    - name: Playwright cache key
      id: version
      shell: bash
      working-directory: web
      run: |
        version=$(node -e "const fs = require('fs'); const lock = fs.readFileSync('pnpm-lock.yaml', 'utf8'); const match = lock.match(/'@playwright\/test':\s+specifier: [^\n]+\s+version: ([^\s(]+)/); if (!match) throw new Error('Playwright version missing from lockfile'); process.stdout.write(match[1]);")
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Restore Playwright browsers
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}
    - name: Browser runtime
      shell: bash
      working-directory: web
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        for attempt in 1 2; do
          if timeout --kill-after=10s 220s bash -e -c 'if [ "$CACHE_HIT" = "true" ]; then pnpm exec playwright install-deps chromium; else pnpm exec playwright install --with-deps chromium; fi'; then
            exit 0
          fi
          echo "::warning::Playwright Chromium/dependencies install failed or hung (attempt $attempt of 2)."
        done
        echo "::error::Playwright Chromium/dependencies install failed or hung after two attempts."
        exit 1
    - name: Save Playwright browsers
      if: always() && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.cache.outputs.cache-primary-key }}
