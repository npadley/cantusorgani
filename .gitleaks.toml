[extend]
useDefault = true

# event_key is a content-addressed SHA-256 of score text, the event logger,
# LilyPond version and shared includes (pipeline/typeset/events.py).
# Ignore only this JSON hash field in the compact melody audit; scan every
# other field and file with the default rules, including generic-api-key.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated melody event-cache SHA-256, not an API credential"
condition = "AND"
paths = ['''^data/typeset/melody-audit\.json$''']
regexTarget = "line"
regexes = ['''^\s*"event_key":\s*"[a-f0-9]{64}"[,]?\s*$''']

# Ordinary Form occasion keys are lowercase hyphenated slugs such as
# "advent-1-thursday" (data/ordinary-form/occasions.yml and its generated
# JSON). Ignore only a line that is nothing but such a key.
[[rules.allowlists]]
description = "Ordinary Form occasion slug keys, not API credentials"
condition = "AND"
paths = ['''^data/ordinary-form/occasions\.yml$''', '''^data/ordinary-form-propers\.json$''']
regexTarget = "line"
regexes = ['''^\s*(- key: [a-z0-9]+(-[a-z0-9]+)*|"key": "[a-z0-9]+(-[a-z0-9]+)*",?)\s*$''']

# The identity migration report hashes each source file it reads, keyed by
# repository path (pipeline/identities/projection.py). Paths such as
# "…sapientiae.csv.ly" contain "api". Ignore only a line that is nothing but a
# data/ path and its SHA-256.
[[rules.allowlists]]
description = "Identity migration input SHA-256 by data/ path, not API credentials"
condition = "AND"
paths = ['''^data/identities/migration\.json$''']
regexTarget = "line"
regexes = ['''^\s*"data/[A-Za-z0-9_./-]+":\s*"[a-f0-9]{64}",?\s*$''']
