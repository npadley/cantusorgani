# Cloudflare Pages configuration for cantusorgani.org. `wrangler pages deploy
# dist` reads it: the static site in dist/, plus the admin Functions in
# functions/ (only /admin/api/* and /api/github/webhook run code; every other
# page is served as a static file).
name = "cantusorgani"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-07"

# The corrections database, shared with the Worker that takes readers' reports
# (workers/corrections).
[[d1_databases]]
binding = "DB"
database_name = "cantusorgani-corrections"
database_id = "4d796209-0d9a-46bd-94c0-00a6435eb502"
migrations_dir = "../workers/corrections/migrations"

# Not secret. Empty values leave the admin screen answering "not configured".
[vars]
PUBLIC_ASSET_BASE = "https://images.cantusorgani.org"
ACCESS_TEAM_DOMAIN = "padley.cloudflareaccess.com"
# The Access application's audience tag: an identifier, public in every Access
# sign-in redirect for /admin/, so not a secret (hence gitleaks:allow below).
ACCESS_AUD = "c605b03d2315a0ace4b6c1dd3396d0247f6bfb313fcbe76fdcba5d8976952ef4"  # gitleaks:allow
GITHUB_REPO = "npadley/cantusorgani"
GITHUB_APP_ID = "5100169"
GITHUB_INSTALLATION_ID = "165561944"

# Secrets, never here (npx wrangler pages secret put <NAME> --project-name cantusorgani):
#   EDITORS                 comma-separated addresses; the first is the owner
#   GITHUB_APP_PRIVATE_KEY  the GitHub App's private key (PEM)
#   GITHUB_WEBHOOK_SECRET   the App's webhook secret

# Pages selects this environment for non-production --branch deployments.
# These bindings are shared by all preview branches, separate from production.
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "cantusorgani-corrections-preview"
database_id = "1c587bc7-0b19-4be0-a95b-b29780df7788"
migrations_dir = "../workers/corrections/migrations"

[env.preview.vars]
# Environments don't inherit [vars]. The admin's typeset preview reads this at
# runtime; the corrections endpoint and Turnstile key are blanked at build time.
PUBLIC_ASSET_BASE = "https://images.cantusorgani.org"
ACCESS_TEAM_DOMAIN = "padley.cloudflareaccess.com"
ACCESS_AUD = "c605b03d2315a0ace4b6c1dd3396d0247f6bfb313fcbe76fdcba5d8976952ef4"  # gitleaks:allow
# Leave publishing disabled; never give previews the production GitHub App key.
GITHUB_REPO = ""
GITHUB_APP_ID = ""
GITHUB_INSTALLATION_ID = ""
